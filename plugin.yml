# Canonical descriptor for the anchor plugin — edit here, never plugin.json.
# shipyard projects this into .claude-plugin/plugin.json and the marketplace
# catalog (the suite: block). suite.describe is generated from the
# skills/rules/hooks sources — the projection job writes it, don't hand-edit it.

name: anchor
version: 1.13.0
description: "Consistency across the code-change lifecycle: issue, change request, review, release."
author: chris-peterson
repository: https://github.com/chris-peterson/anchor
license: MIT
keywords: [commit, issue, pull-request, merge-request, review, git, forge, ai, claude-code]

validate:
  accept:
    - warning: root
      path: CLAUDE.md
      because: >-
        CLAUDE.md at the root is this repo's own agent instructions, not context
        the plugin ships. It points at AGENTS.md, which every agent reads.

# → marketplace.json entry
marketplace:
  category: development
  homepage: https://chris-peterson.github.io/anchor/#/

# → the suite's event catalog. The contract these hold up:
# https://github.com/chris-peterson/claude-marketplace/blob/main/authoring/plugin-contract.md
#
# Keys are bare: `name:` above supplies the `codes.bridgeai.anchor/` prefix, so a
# producer cannot typo its own. `tests/announce.test.sh` asserts every key here
# appears in the source that emits it.
events:
  publishes:
    - key: cr.created
      when: >-
        prepare-review opened a change request. Emitted by the script that
        creates it, so it fires whether or not the skill runs to completion. A
        run announces this or cr.updated, never both.
      emitted_by: scripts/prepare-review.sh
      fields:
        uri: the change request's web address
        title: its title, as anchor set it on creation
    - key: cr.updated
      when: >-
        prepare-review changed a change request that already existed. One
        announcement covers the whole phase — description, labels, milestone,
        ordering dependency — rather than one per mutation, and a re-run on the
        same CR fires it again.
      emitted_by: skills/prepare-review, via scripts/announce.sh
      fields:
        uri: the change request's web address
        title:
          describe: >-
            its title, as the forge reports it. Read back rather than set here,
            so a change request the forge reports without one arrives with the
            field present and empty.
          optional: true
    - key: cr.ready
      when: >-
        the draft flag came off, on the author's say-so. Emitted by the script
        that clears it, which is the one path that does, so the two callers
        announce identically: review's self-review handoff, where the author is
        done and wants eyes on the change, and merge's draft gate, where they
        choose to land one that never left draft. From that gate the same run
        goes on to announce cr.merged unless a later gate stops it; from the
        handoff it stands alone.
      emitted_by: scripts/mark-ready.sh
      fields:
        uri: the change request's web address
    - key: cr.merged
      when: >-
        merge landed the change request. In-session merges only: what the forge
        completes on its own afterwards, an auto-merge or a merge-on-green,
        happens with nothing of anchor's running, so a subscriber that has to
        account for those reconciles against the forge rather than waiting on
        this.
      emitted_by: skills/merge, via scripts/announce.sh
      fields:
        uri: the change request's web address
        title: its title, as the forge reports it
        merged_at: >-
          when the forge recorded the merge, in its own ISO-8601 form. The
          forge's time rather than the moment the announcement was made, so a
          subscriber recording completion records when it happened.
        sha: the merge commit
    - key: commit.pushed
      when: >-
        commit pushed the branch. Emitted by the script that pushes, so it fires
        whether or not the skill runs to completion, and only once the push has
        landed: a commit sitting on a local branch is not yet something another
        tool can reach. An amend that force-pushes announces again, carrying the
        new sha.
      emitted_by: scripts/commit.sh
      fields:
        uri:
          describe: >-
            the commit's web address on the forge, which names the project as
            well as the sha. Present and empty where `origin` is neither GitHub
            nor GitLab, since there is no address to build.
          optional: true
        sha: the commit, abbreviated
        branch: the branch that was pushed
    - key: issue.created
      when: >-
        issue filed a new issue. A run that adds to an issue that already
        existed announces nothing: there is no new artifact for a subscriber to
        record, and the skill's own report says what it added.
      emitted_by: skills/issue, via scripts/announce.sh
      fields:
        uri: the issue's web address
        title: its title, as anchor filed it
    - key: release.created
      when: >-
        release published a release, once the forge reports it exists. A repo
        whose version bump is a commit rather than a release announces nothing
        here; the bookkeeping commit's own commit.pushed is the artifact on that
        path.
      emitted_by: skills/release, via scripts/announce.sh
      fields:
        uri: the release's web address, which names the project as well as the tag
        tag: the ref it shipped as

# → marketplace SPA; keys mirror the SPA's PLUGINS object.
suite:
  cli: false
  group: waypoints
  # Activated by user-invoked skills (commit, prepare-review) and by ambient
  # rules injected at session start.
  activations: [user, session]
  gloss: One skill per step of a code change, from issue to release.
  pitch: "Nervous about keeping code you didn't write? It walks you through the diff first, then commits with a why-first message and opens the change request."
  what: "Keeps your issues, commits, change requests, reviews, and releases consistent — the same quality, formatting, and content every time, not reinvented per change."
  cmds:
    - ["/anchor:commit", "Review the changeset, then commit with a why-first message and push"]
    - ["/anchor:prepare-review", "Rebase on the default branch and open a draft change request"]
    - ["/anchor:review", "Read every change in a CR, weigh it against your qualities, post findings inline"]
    - ["/anchor:resolve-feedback", "Work a CR's review threads to done, one by one"]
    - ["/anchor:merge", "Check the merge gates, wait on the pipeline, then land the CR and clean up"]
    - ["/anchor:release", "Work out what's shipping, recommend a version, draft the notes, publish"]
  # Skill-anchored previews of the two flagship skills, shown live on the docs
  # site; the session: below is the at-a-glance flow the hub also reads. Frames
  # are lifted from real runs (review rejections, the WHY prompt, the CR structure)
  # so the previews read as an actual session, not a script.
  # >>> shipyard:describe — generated from source by `shipyard gen-describe`; do not edit >>>
  describe:
    skills:
      backlog: List and rank the forge issues assigned to you so you can pick what to work on next — ranked by soonest due date, then most recently updated.
      commit: Stage changes, run tests, review the diff and drafted commit message with the user, then commit and push once they approve.
      issue: File a new forge issue (or update an existing one) that leads with WHY the work is needed.
      merge: Merge an approved change request once its gates are green — waiting on the pipeline if needed — then clean up the branch.
      pipeline: Report a commit's forge pipeline state, or watch until it settles.
      prepare-review: Open the PR/MR on an already-pushed branch, rebase on the default branch if behind, and draft a description that tells reviewers WHY the change exists.
      release: Cut a release for what has landed — recommend a semver bump, draft the notes, and drive the repo's own publish path.
      resolve-feedback: Fetch an open CR's review feedback and drive each thread to resolution — fix, reply, resolve.
      review: Review an open change request — read every change in the diff viewer, examine it against the qualities you've set, then post the findings as inline threads once the exact text is approved.
    rules:
      omit-attribution-trailers: Omit AI attribution trailers
      rewrite-history-through-anchor: Route history rewrites through `anchor`
      use-forge-clis: Drive forge operations through `gh` / `glab`
    hooks:
      emit-rules: SessionStart — Emits the plugin's ambient rules into the agent's context.
      hooks: 'Hook wiring: SessionStart→emit-rules.'
  # <<< shipyard:describe <<<
  examples:
    - label: "/anchor:commit"
      ac: "--ship"
      frames:
        - { t: you, text: "/anchor:commit" }
        - { t: claude, text: "214 tests green, staged, message drafted — opening the diff for a code review before I commit." }
        - t: diff
          file: fare.js
          lines:
            - { ln: 22, text: "function fare(mins, crossesMidnight) {" }
            - { ln: 23, text: "const fare = crossesMidnight ? DAILY_MAX : mins * RATE", del: true }
            - { ln: 24, text: "const fare = Math.min(mins * RATE, DAILY_MAX)", add: true }
            - { ln: 25, text: "return fare" }
            - { ln: 26, text: "}" }
          comment: { ln: 24, body: "good fix — but DAILY_MAX is now defined here and in pricing.js; use the one source" }
        - { t: claude, text: "Addressed the rejection, re-reviewed clean, so committed 4a1f9c2 and pushed to fix-fare-cap. DAILY_MAX now imported from pricing.js, and I swept the two other call sites with the same duplication. Message leads with the overcharge, not the diff." }
    - label: "/anchor:prepare-review"
      ac: "--orient"
      frames:
        - { t: you, text: "/anchor:prepare-review" }
        - { t: claude, text: "Branch's already pushed, so I opened draft CR #128 against it. It's 8 behind main and still a draft — rebasing now is low-risk. Rebased clean, force-pushed with lease." }
        - { t: claude, text: "Before I draft — the WHY, in one line: riders on trips crossing midnight were billed the full daily max instead of elapsed minutes. Is that the whole story?" }
        - { t: you, text: "yeah — support flagged three overcharges this week" }
        - { t: claude, text: "Description written to #128 — leads with the overcharge, then a Review guide that deep-links the fare-cap change so a reviewer's skim lands on the money path first." }
  session:
    - { t: you, text: "/anchor:commit" }
    - { t: claude, text: "No unpushed commits here, so this is a new commit. Running the suite before I stage anything." }
    - { t: cmd, cmd: "npm test", out: "Tests: 214 passed, 214 total" }
    - { t: claude, text: "Green. Staged the fare-calc fix and drafted the message — opening the diff for a code review before I commit." }
    - t: diff
      file: fare.js
      lines:
        - { ln: 22, text: "function fare(mins, crossesMidnight) {" }
        - { ln: 23, text: "const fare = crossesMidnight ? DAILY_MAX : mins * RATE", del: true }
        - { ln: 24, text: "const fare = Math.min(mins * RATE, DAILY_MAX)", add: true }
        - { ln: 25, text: "return fare" }
        - { ln: 26, text: "}" }
      comment: { ln: 24, body: "good fix — but DAILY_MAX is now defined here and in pricing.js; use the one source" }
    - { t: claude, text: "Addressed the rejection, re-reviewed clean, so committed 4a1f9c2 and pushed. DAILY_MAX pulled from pricing.js, and I swept every call site with the same duplication." }

docs:
  code_languages: [bash, yaml, json]
  mermaid: true
