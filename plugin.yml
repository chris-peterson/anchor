# Canonical descriptor for the anchor plugin — edit here, never plugin.json.
# shipyard projects this into .claude-plugin/plugin.json and the marketplace
# catalog (the suite: block). suite.describe is generated from the
# skills/rules/hooks sources — the projection job writes it, don't hand-edit it.

name: anchor
version: 2.1.0
description: "One skill per step of the code-change lifecycle: file an issue, review the diff and commit, open and describe a change request, resolve review feedback, merge, release, and watch the pipeline. Supports multiple source forges (GitHub, GitLab)."
author: chris-peterson
repository: https://github.com/chris-peterson/anchor
icon: .claude-plugin/icon.svg
license: MIT
keywords: [commit, issue, pull-request, merge-request, review, git, forge, ai, claude-code]

validate:
  accept:
    - warning: root
      path: CLAUDE.md
      because: >-
        CLAUDE.md at the root is this repo's own agent instructions, not context
        the plugin ships. It points at AGENTS.md, which every agent reads.

# → marketplace.json entry
marketplace:
  category: development
  homepage: https://chris-peterson.github.io/anchor/#/

# → the suite's event catalog. The contract these hold up:
# https://github.com/chris-peterson/claude-marketplace/blob/main/authoring/plugin-contract.md
#
# Keys are bare: `name:` above supplies the `codes.bridgeai.anchor/` prefix, so a
# producer cannot typo its own. `tests/announce.test.sh` asserts every key here
# appears in the source that emits it.
events:
  publishes:
    - key: cr.created
      when: >-
        prepare-review opened a change request. Emitted by the script that
        creates it, so it fires whether or not the skill runs to completion. A
        run announces this or cr.updated, never both.
      emitted_by: scripts/prepare-review.sh
      fields:
        uri: the change request's web address
        title: its title, as anchor set it on creation
    - key: cr.updated
      when: >-
        prepare-review changed a change request that already existed. One
        announcement covers the whole phase — description, labels, milestone,
        ordering dependency — rather than one per mutation, and a re-run on the
        same CR fires it again.
      emitted_by: skills/prepare-review
      fields:
        uri: the change request's web address
        title:
          describe: >-
            its title, as the forge reports it. Read back rather than set here,
            so a change request the forge reports without one arrives with the
            field present and empty.
          optional: true
    - key: cr.ready
      when: >-
        the draft flag came off, on the author's say-so. Emitted by the script
        that clears it, which is the one path that does, so its callers
        announce identically: the ready skill, where the author asks for it
        outright; review's self-review handoff, where the author is done and
        wants eyes on the change; and merge's draft gate, where they choose to
        land one that never left draft. From that gate the same run
        goes on to announce cr.merged unless a later gate stops it; from the
        handoff it stands alone.
      emitted_by: scripts/mark-ready.sh
      fields:
        uri: the change request's web address
    - key: cr.merged
      when: >-
        merge landed the change request. In-session merges only: what the forge
        completes on its own afterwards, an auto-merge or a merge-on-green,
        happens with nothing of anchor's running, so a subscriber that has to
        account for those reconciles against the forge rather than waiting on
        this.
      emitted_by: scripts/merge.sh
      fields:
        uri: the change request's web address
        title: its title, as the forge reports it
        merged_at: >-
          when the forge recorded the merge, in its own ISO-8601 form. The
          forge's time rather than the moment the announcement was made, so a
          subscriber recording completion records when it happened.
        sha: the merge commit
    - key: commit.pushed
      when: >-
        commit pushed the branch. Emitted by the script that pushes, so it fires
        whether or not the skill runs to completion, and only once the push has
        landed: a commit sitting on a local branch is not yet something another
        tool can reach. An amend that force-pushes announces again, carrying the
        new sha.
      emitted_by: scripts/commit.sh
      fields:
        uri:
          describe: >-
            the commit's web address on the forge, which names the project as
            well as the sha. Present and empty where `origin` is neither GitHub
            nor GitLab, since there is no address to build.
          optional: true
        sha: the commit, abbreviated
        branch: the branch that was pushed
    - key: issue.created
      when: >-
        issue filed a new issue. A run that adds to an issue that already
        existed announces nothing: there is no new artifact for a subscriber to
        record, and the skill's own report says what it added.
      emitted_by: skills/issue
      fields:
        uri: the issue's web address
        title: its title, as anchor filed it
    - key: attention.requested
      when: >-
        the review probe found a review that can open. Announced from the probe
        because the launch runs in the background, where nothing it prints is
        seen until the review is over; a subscriber hears it before the next tool
        call opens the review. A probe the skill doesn't follow with a launch
        has no release to match it.
      emitted_by: scripts/review-diff.sh
      fields:
        target: >-
          what is under review: the CR's web address where the review names one,
          a drafted document's title for a review of files, or the repository's
          root
        skill:
          describe: the skill asking for the review, as passed to `--skill`
          optional: true
    - key: attention.released
      when: >-
        a review launch ended, on every way out of it: a verdict, a refusal, or
        a killed dispatcher. Read with the verdict, by whichever tool the agent
        reads it with.
      emitted_by: scripts/review-diff.sh
      fields: {}
    - key: pipeline.watched
      when: >-
        a skill is about to watch a commit's pipeline in the background: after a
        push, a rebase, or a merge, on a merge gate waiting for green, or on an
        explicit /anchor:pipeline watch. Announced from the foreground probe that
        precedes the launch, because a background call's output reaches no hook
        while it runs; a subscriber hears it before the watch starts polling. A
        watch the after-push gate skips (turned off by config, or every run
        already reported) announces nothing, and neither does a probe whose
        forge read failed. No pipeline yet still announces, with `uri` empty:
        the watch waits for one to appear.
      emitted_by: scripts/pipeline-status.sh
      fields:
        uri:
          describe: >-
            the pipeline's web page; on GitHub, the run the commit's verdict
            currently comes from. Present and empty when no pipeline exists for
            the commit yet.
          optional: true
        sha: the commit watched, in full
        branch: the ref the commit was resolved from
        workflow:
          describe: >-
            the GitHub workflow the watch is scoped to, as the caller named it.
            Present and empty for an unscoped watch, and always on GitLab.
          optional: true
        job:
          describe: the one job the watch tracks, where it tracks one
          optional: true
        skill:
          describe: the skill watching, as passed to `--skill`
          optional: true
    - key: pipeline.updated
      when: >-
        a watched pipeline changed in a way a subscriber can act on: its state
        moved (the first sight of it, in flight to settled, pending to running),
        or, once per watch, a job failed while the pipeline was still in flight.
        Not every poll: a state already announced is not announced again, and
        neither "no pipeline yet" nor a failed forge read is a state. Printed by
        the background watch as it happens, so a subscriber reads it from the
        finished task's output file, not from a hook on the launch. The last one
        a watch announces is where the pipeline settled, unless the watch hit
        its ceiling first.
      emitted_by: scripts/pipeline-status.sh
      fields:
        uri: the pipeline's web page; on GitHub, the run the verdict came from
        sha: the commit watched, in full
        workflow:
          describe: >-
            the GitHub workflow the verdict came from. Present and empty on
            GitLab.
          optional: true
        job:
          describe: >-
            the tracked job, in a watch of one job; `state` and `previous` are
            then that job's
          optional: true
        state: >-
          the normalized state now: running, pending, success, failed, canceled,
          skipped, or manual
        previous: >-
          the state last announced by this watch, `none` before the first. Equal
          to `state` on a job failure, which changes no state.
        failed_job:
          describe: the job that failed, on the early-failure announcement only
          optional: true
        failed_job_url:
          describe: that job's web page, on the early-failure announcement only
          optional: true
    - key: release.created
      when: >-
        release published a release, once the forge reports it exists. A repo
        whose version bump is a commit rather than a release announces nothing
        here; the bookkeeping commit's own commit.pushed is the artifact on that
        path.
      emitted_by: skills/release
      fields:
        uri: the release's web address, which names the project as well as the tag
        tag: the ref it shipped as

# → marketplace SPA; keys mirror the SPA's PLUGINS object.
suite:
  cli: false
  group: waypoints
  # Activated by user-invoked skills (commit, prepare-review) and by ambient
  # rules injected at session start.
  activations: [user, session]
  gloss: anchor your development practices.
  pitch: "An agent working for you is also speaking for you: issues, change requests, review comments, release notes. Every one of them reaches you in full before anyone else sees it."
  what: "Keeps your issues, commits, change requests, reviews, and releases consistent: the same quality, structure, and formatting every time, not reinvented per change."
  cmds:
    - ["/anchor:commit", "Review the changeset, then commit with a why-first message and push"]
    - ["/anchor:amend", "Fold the staged changes into the last commit, with the same tests and review as a commit"]
    - ["/anchor:prepare-review", "Rebase on its base branch and open a draft change request"]
    - ["/anchor:rebase", "Catch a branch, or its whole stack, up to the branch it merges into, resolve the conflicts, and force-push"]
    - ["/anchor:stack", "Show a stack of CRs as a tree, start the next branch on top, move a branch onto another CR, review it bottom up"]
    - ["/anchor:review", "Weigh a CR against your qualities, make the clear fixes, and decide each finding in revdiff"]
    - ["/anchor:ready", "Take a draft CR out of draft, request reviewers, and report its pipeline"]
    - ["/anchor:resolve-feedback", "Work a CR's review threads to done, one by one"]
    - ["/anchor:merge", "Check the merge gates, wait on the pipeline, then land the CR and clean up"]
    - ["/anchor:release", "Work out what's shipping, recommend a version, draft the notes, publish"]
  # Skill-anchored previews of the two flagship skills, shown live on the docs
  # site; the session: below is the at-a-glance flow the hub also reads. Frames
  # are lifted from real runs (review rejections, the WHY prompt, the CR structure)
  # so the previews read as an actual session, not a script.
  # >>> shipyard:describe — generated from source by `shipyard gen-describe`; do not edit >>>
  describe:
    skills:
      amend: Fold the staged changes into the last commit — commit's flow with the amend already chosen, so tests and the review still run before it amends and pushes.
      backlog: List and rank the forge issues assigned to you, work already in flight first, so you can pick what to work on next — each issue is checked against the open CRs and branches carrying it, each CR for its draft state and whether you've run /anchor:review on it, and stale issues are flagged for an /anchor:issue batch.
      commit: Stage changes, run tests, review the diff and drafted commit message with the user, then commit and push once they approve.
      issue: File a new forge issue (or update an existing one) that leads with WHY the work is needed, or review edits to several issues as one batch.
      merge: Merge an approved change request once its gates are green — waiting on the pipeline if needed — then clean up the branch.
      pipeline: Report a commit's forge pipeline state, or watch until it settles.
      prepare-review: Open the PR/MR on an already-pushed branch, rebase on its base branch if behind, and draft a description that tells reviewers WHY the change exists.
      ready: Mark a draft change request ready for review.
      rebase: Rebase the current branch on its base branch (the CR's target, or the branch it's stacked on), or a whole stack bottom-up, resolve conflicts, and force-push what was already pushed.
      release: Cut a release for what has landed — recommend a semver bump, draft the notes, and drive the repo's own publish path.
      resolve-feedback: Fetch an open CR's review feedback and drive each thread to resolution — fix, reply, resolve.
      review: Review an open change request, or a branch that has no CR yet — open revdiff on the commits you haven't reviewed so you read them and leave notes while agents examine them against the qualities you've set, draft a fix for each note and finding, then show those drafts alone so you keep, change, or drop each one.
      stack: Work with a stack of change requests, each built on the one below.
    rules:
      omit-attribution-trailers: Omit AI attribution trailers
      rewrite-history-through-anchor: Route history rewrites through `anchor`
      use-forge-clis: Drive forge operations through `gh` / `glab`
    hooks:
      emit-rules: SessionStart — Emits the plugin's ambient rules into the agent's context.
      hooks: 'Hook wiring: SessionStart→emit-rules; PreToolUse→route-to-skill (Bash).'
      route-to-skill: PreToolUse — Denies a raw forge mutation an anchor skill owns and names the skill, starting with a release publish.
  # <<< shipyard:describe <<<
  examples:
    - label: "/anchor:commit"
      ac: "--ship"
      frames:
        - { t: you, text: "/anchor:commit" }
        - { t: claude, text: "214 tests green, staged, message drafted — opening the diff for a code review before I commit." }
        - t: diff
          file: fare.js
          lines:
            - { ln: 22, text: "function fare(mins, crossesMidnight) {" }
            - { ln: 23, text: "const fare = crossesMidnight ? DAILY_MAX : mins * RATE", del: true }
            - { ln: 24, text: "const fare = Math.min(mins * RATE, DAILY_MAX)", add: true }
            - { ln: 25, text: "return fare" }
            - { ln: 26, text: "}" }
          comment: { ln: 24, body: "good fix — but DAILY_MAX is now defined here and in pricing.js; use the one source" }
        - { t: claude, text: "Addressed the rejection, re-reviewed clean, so committed 4a1f9c2 and pushed to fix-fare-cap. DAILY_MAX now imported from pricing.js, and I swept the two other call sites with the same duplication. Message leads with the overcharge, not the diff." }
    - label: "/anchor:prepare-review"
      ac: "--orient"
      frames:
        - { t: you, text: "/anchor:prepare-review" }
        - { t: claude, text: "Branch's already pushed, so I opened draft CR #128 against it. It's 8 behind main and still a draft — rebasing now is low-risk. Rebased clean, force-pushed with lease." }
        - { t: claude, text: "Before I draft — the WHY, in one line: riders on trips crossing midnight were billed the full daily max instead of elapsed minutes. Is that the whole story?" }
        - { t: you, text: "yeah — support flagged three overcharges this week" }
        - { t: claude, text: "Description written to #128 — leads with the overcharge, then a Review guide that deep-links the fare-cap change so a reviewer's skim lands on the money path first." }
  session:
    - { t: you, text: "/anchor:commit" }
    - { t: claude, text: "No unpushed commits here, so this is a new commit. Running the suite before I stage anything." }
    - { t: cmd, cmd: "npm test", out: "Tests: 214 passed, 214 total" }
    - { t: claude, text: "Green. Staged the fare-calc fix and drafted the message — opening the diff for a code review before I commit." }
    - t: diff
      file: fare.js
      lines:
        - { ln: 22, text: "function fare(mins, crossesMidnight) {" }
        - { ln: 23, text: "const fare = crossesMidnight ? DAILY_MAX : mins * RATE", del: true }
        - { ln: 24, text: "const fare = Math.min(mins * RATE, DAILY_MAX)", add: true }
        - { ln: 25, text: "return fare" }
        - { ln: 26, text: "}" }
      comment: { ln: 24, body: "good fix — but DAILY_MAX is now defined here and in pricing.js; use the one source" }
    - { t: claude, text: "Addressed the rejection, re-reviewed clean, so committed 4a1f9c2 and pushed. DAILY_MAX pulled from pricing.js, and I swept every call site with the same duplication." }

docs:
  code_languages: [bash, yaml, json]
  mermaid: true
