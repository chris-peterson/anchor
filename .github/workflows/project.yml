name: Project

# Every generated artifact has one writer, and it is this job. shipyard's project
# action regenerates .claude-plugin/plugin.json, hooks/hooks.json, and plugin.yml's
# suite.describe block from their sources and commits the result to the branch, so
# a committed artifact matches its source at all times and the diff a reviewer
# approves is the change that lands. Rendered docs/ is git-ignored, so it stays out
# of the commit and is built fresh by the docs deploy.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  project:
    runs-on: ubuntu-latest
    # A fork's token is read-only, so the push would fail and the check would go
    # red on a contributor's first PR. Skipping the job leaves the projection to
    # the maintainer's own push, which is the only place it can happen.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6
        with:
          # The default pull_request checkout leaves a merge commit in detached
          # HEAD, and there is no branch there to push a projection to.
          ref: ${{ github.head_ref }}

      - uses: chris-peterson/shipyard/actions/project@v2
