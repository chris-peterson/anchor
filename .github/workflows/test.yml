name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suites:
    # One job, discovered: tests/run-all.sh walks tests/*.test.sh and runs the
    # ones declaring this platform in their own `# ci-platforms:` header, so a
    # new suite needs no wiring here. The matrix exists for the suites whose
    # subject *is* the platform — which mktemp the shell resolves, whether the
    # host has sha1sum — and everything else declares linux and runs once.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      # The suites that commit, push to a local bare remote, or read a CR head
      # need an identity; a runner has none.
      - name: configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: test suites
        run: bash tests/run-all.sh
