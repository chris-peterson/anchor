name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tmpfile:
    # The temp-path helper's portability claim is cross-platform, so prove it on
    # each mktemp it must survive: GNU coreutils (ubuntu), BSD (macos — the
    # binary that broke the old form), and Git Bash's MSYS2 mktemp (windows).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: temp-path helper
        run: bash tests/tmpfile.test.sh
      # In this matrix because the deep-link anchors are path hashes, and the
      # hashing binary varies (macOS ships `shasum` with no `sha1sum`).
      - name: deep links
        run: bash tests/deep-links.test.sh

  commit:
    # Exercises scripts/commit.sh end-to-end (commit + push variants, the
    # push-existing mode, and the default-branch guard) against a local bare
    # remote.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: commit helper
        run: bash tests/commit.test.sh
      - name: commit preflight
        run: bash tests/commit-preflight.test.sh

  release:
    # Exercises scripts/release-recon.sh against a repo per release model, since
    # the model decides who owns the version bump and a wrong read collides with
    # the CI workflow's own commit.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: release recon
        run: bash tests/release-recon.test.sh

  pipeline:
    # Exercises scripts/pipeline-status.sh against stub gh/glab binaries that
    # filter their fixtures the way the real CLIs do, since the verdict turns on
    # which runs a lookup can see — a release-triggered run carries the tag as
    # its branch, and a GitHub commit has one run per workflow.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: pipeline status
        run: bash tests/pipeline-status.test.sh

  review:
    # Exercises the review dispatcher and its moor/revdiff adapters against stub
    # backends, asserting the normalized REV contract each emits.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: review dispatcher + adapters
        run: bash tests/review-diff.test.sh
