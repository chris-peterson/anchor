name: Repro windows revdiff

# Throwaway, run 2: how the arguments anchor builds reach a native Windows exe
# launched from Git Bash, and whether a Go program finds Git's `vi`.

on:
  push:
    branches: [repro-windows-revdiff]

permissions:
  contents: read

jobs:
  repro:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: build a native args/LookPath probe
        run: |
          mkdir -p "$RUNNER_TEMP/p" && cd "$RUNNER_TEMP/p"
          cat > main.go <<'EOF'
          package main

          import (
          	"fmt"
          	"os"
          	"os/exec"
          )

          func main() {
          	for i, a := range os.Args[1:] {
          		fmt.Printf("arg[%d]=%s\n", i, a)
          	}
          	fmt.Printf("REVDIFF_CONFIG=%s\n", os.Getenv("REVDIFF_CONFIG"))
          	for _, n := range []string{"vi", "vim", "nano"} {
          		p, err := exec.LookPath(n)
          		fmt.Printf("LookPath(%s)=%q err=%v\n", n, p, err)
          	}
          }
          EOF
          go mod init probe >/dev/null 2>&1
          go build -o probe.exe .

      - name: "D1 anchor's command string, run by sh as a runner would"
        run: |
          f=$(mktemp "${TMPDIR:-/tmp}/anchor-review-out.XXXXXX")
          cmd="REVDIFF_CONFIG='$f' '$RUNNER_TEMP/p/probe.exe' '--output=$f' '--only=(context).md' 'HEAD~1' 'HEAD' 2>'$f.err'"
          echo "cmd: $cmd"
          sh -c "$cmd"
          echo "--- can bash read the path the exe was given? $( [ -e "$f" ] && echo yes )"

      - name: "D2 LookPath with only the Windows system PATH (no Git usr/bin)"
        shell: pwsh
        run: |
          $env:PATH = "C:\Windows\system32;C:\Windows"
          & "$env:RUNNER_TEMP\p\probe.exe"
